name: Archer Review Dispatch

on:
  workflow_dispatch:
    inputs:
      service_job_id:
        description: Archer service job id
        required: true
        type: string
      pr_id:
        description: Rust PR id
        required: true
        type: string
      model:
        description: Model name
        required: true
        type: string

run-name: "Archer PR #${{ inputs.pr_id }} / ${{ inputs.service_job_id }}"

jobs:
  review:
    runs-on:
      - self-hosted
      - archer-school

    env:
      ARCHER_REPO_ROOT: ${{ vars.ARCHER_REPO_ROOT }}

    steps:
      - name: Validate runner setup
        shell: bash
        run: |
          test -n "$ARCHER_REPO_ROOT"
          test -d "$ARCHER_REPO_ROOT"
          test -x "$(command -v node)"
          test -x "$(command -v npm)"

      - name: Prepare output directory
        shell: bash
        run: |
          out_dir="$ARCHER_REPO_ROOT/service_data/reviews"
          mkdir -p "$out_dir"
          echo "ARCHER_OUTPUT_DIR=$out_dir" >> "$GITHUB_ENV"

      - name: Run Archer on school CPU runner
        shell: bash
        env:
          ARCHER_OUTPUT_DIR: ${{ env.ARCHER_OUTPUT_DIR }}
          ARCHER_LM_API_ENDPOINT: ${{ secrets.ARCHER_LM_API_ENDPOINT }}
          ARCHER_LM_API_KEY: ${{ secrets.ARCHER_LM_API_KEY }}
          LAB_GITHUB_TOKEN: ${{ secrets.LAB_GITHUB_TOKEN }}
          ARCHER_MODEL: ${{ inputs.model }}
        run: |
          cd "$ARCHER_REPO_ROOT"
          source scripts/upenv.sh
          npm ci
          npm run build
          node dist/cli.js review "${{ inputs.pr_id }}" --model "${{ inputs.model }}"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archer-${{ inputs.service_job_id }}
          path: |
            ${{ env.ARCHER_OUTPUT_DIR }}/**
          if-no-files-found: warn
